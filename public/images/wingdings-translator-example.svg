<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Wingdings translator example: the English word Hello converted into Wingdings 1 symbols">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#09090b"/>
  <rect width="1200" height="10" fill="url(#bar)"/>
  <text x="70" y="105" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" letter-spacing="6" fill="#a1a1aa">WINGDINGS TRANSLATOR · EXAMPLE</text>
  <text x="70" y="330" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="bold" fill="#f4f4f5">Hello</text>
  <text x="520" y="330" font-family="Arial, Helvetica, sans-serif" font-size="100" font-weight="bold" fill="#a78bfa">→</text>
  <g font-family="'Segoe UI Symbol', 'Noto Sans Symbols 2', 'DejaVu Sans', sans-serif" font-size="115" font-weight="bold">
    <text x="650" y="330" fill="#818cf8">☟</text>
    <text x="752" y="330" fill="#a78bfa">♏</text>
    <text x="858" y="330" fill="#e879f9">●</text>
    <text x="958" y="330" fill="#818cf8">●</text>
    <text x="1058" y="330" fill="#a78bfa">□</text>
  </g>
  <text x="70" y="455" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#d4d4d8">Type English. Get Wingdings symbols.</text>
  <text x="70" y="505" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#a1a1aa">Copy and paste them anywhere.</text>
  <text x="70" y="592" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" letter-spacing="2" fill="#71717a">WINGDINGS 1 · 2 · 3 · WEBDINGS</text>
</svg>
